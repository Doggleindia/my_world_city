name: Deploy My World City

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-my-world-city-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy My World City to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          set -euo pipefail

          echo "$SSH_KEY_B64" | base64 --decode > "$RUNNER_TEMP/my_world_city_actions"

          chmod 600 "$RUNNER_TEMP/my_world_city_actions"

          echo "SSH key prepared."

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: ${{ runner.temp }}/my_world_city_actions
          command_timeout: 20m

          script: |
            set -e

            APP_DIR="/home/ubuntu/my_world_city"
            PM2_APP="my-world-city"

            echo "======================================"
            echo "Deploying My World City"
            echo "======================================"

            cd "$APP_DIR"

            echo "Checking application directory..."
            test "$(pwd -P)" = "$APP_DIR"
            test -f package.json
            test -d .git

            echo "Fetching latest code..."
            git fetch origin main

            echo "Updating application..."
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building application..."
            npm run build

            echo "Restarting My World City..."
            pm2 restart "$PM2_APP" --update-env

            pm2 save

            echo "Checking PM2..."
            pm2 status "$PM2_APP"

            echo "======================================"
            echo "Deployment completed successfully"
            echo "======================================"