version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - npm ci
    build:
      commands:
        # Amplify exposes console env vars at BUILD time but not to the Next.js
        # SSR runtime. Write the server-side vars into .env.production so the
        # production server (@next/env) loads them at request time.
        - |
          env | grep -E '^(MONGODB_URI|SESSION_SECRET|ADMIN_PHONES|SEED_SECRET|SMS_PROVIDER|MSG91_AUTH_KEY|MSG91_SENDER_ID|MSG91_TEMPLATE_ID|TWILIO_ACCOUNT_SID|TWILIO_AUTH_TOKEN|TWILIO_FROM|CLOUDINARY_CLOUD_NAME|CLOUDINARY_API_KEY|CLOUDINARY_API_SECRET|RAZORPAY_KEY_ID|RAZORPAY_KEY_SECRET|RAZORPAY_WEBHOOK_SECRET|NEXT_PUBLIC_RAZORPAY_KEY_ID|NEXT_PUBLIC_SITE_URL)=' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
